name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build web app (dummy env, no secrets needed)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          NEXT_PUBLIC_SITE_URL: https://example.vercel.app
      - name: Build extension
        run: npm run build:extension
        env:
          # Set repository variable APP_ORIGIN to your real https://your-app.vercel.app
          APP_ORIGIN: ${{ vars.APP_ORIGIN || 'https://example.vercel.app' }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-hub-extension
          path: extension/dist
