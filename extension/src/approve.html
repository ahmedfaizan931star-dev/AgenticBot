<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Approve action</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <h1 id="title">Loading…</h1>
  <div class="card" id="details"></div>
  <div class="actions">
    <button id="allow" class="primary" hidden disabled>Allow once</button>
    <button id="site" hidden>Allow reading this site for this browser session</button>
    <button id="deny" class="danger" autofocus>Deny</button>
  </div>
  <small>The agent only acts after you approve. Closing this window denies the request.</small>
</main><script src="approve.js"></script></body></html>
